<style>
/* Layout : en-tête avec progression globale, puis une carte colorée par niveau, chaque étape cochable */
:root{
  --bg:#f5f7fb; --card:#ffffff; --fg:#14182b; --muted:#5b6380; --line:#e2e6f0;
  --c1:#0ea5a4; --c2:#2563eb; --c3:#7c3aed; --c4:#ea580c; --c5:#db2777; --c6:#16a34a;
  --t1:#e6f7f7; --t2:#e8effd; --t3:#f1ebfe; --t4:#fdefe6; --t5:#fce8f2; --t6:#e7f6ec; --c7:#ca8a04; --t7:#fdf6dd;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --card:#181c2e; --fg:#eef0fa; --muted:#9aa2c2; --line:#2a3048;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa; --c4:#fb923c; --c5:#f472b6; --c6:#4ade80;
  --t1:#123033; --t2:#16233f; --t3:#221b3d; --t4:#33221a; --t5:#331a2a; --t6:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --card:#181c2e; --fg:#eef0fa; --muted:#9aa2c2; --line:#2a3048;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa; --c4:#fb923c; --c5:#f472b6; --c6:#4ade80;
  --t1:#123033; --t2:#16233f; --t3:#221b3d; --t4:#33221a; --t5:#331a2a; --t6:#16301f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0}
.hero{background:linear-gradient(120deg,var(--c1),var(--c2) 40%,var(--c3) 70%,var(--c4));color:#fff;border-radius:18px;padding:22px}
.hero .sub{color:#ffffffd9}
.big{display:flex;align-items:baseline;gap:10px;margin-top:16px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:#ffffff40;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#ffffff26;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.level{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lh{background:var(--tint);padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--col)}
.lh .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.lh h2{font-size:20px;color:var(--col)}
.lh .pct{font-family:var(--display);font-weight:700;color:var(--col);font-variant-numeric:tabular-nums}
.lh .meta{color:var(--muted);font-size:13px}
.lbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--col);transition:width .4s}
.group{padding:4px 18px 10px}
.gt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 4px}
label.item{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.group label.item:first-of-type{border-top:0}
input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid var(--col);border-radius:7px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--card)}
input[type=checkbox]:checked{background:var(--col)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
input:focus-visible{outline:3px solid var(--col);outline-offset:2px}
.name{font-weight:600;min-width:0}
.det{display:block;font-weight:400;color:var(--muted);font-size:13px}
.det a{color:var(--col)}
.done .name{text-decoration:line-through;opacity:.55}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--tint);color:var(--col)}
.tag.cert{background:var(--col);color:var(--card)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
/* ===== Thème futuriste : un seul look sombre néon, choisi volontairement ===== */
:root:root:root{
  --bg:#05070f; --card:#0b1020cc; --fg:#e8f1ff; --muted:#8fa3c7; --line:#1d2a48;
  --c1:#00f0d0; --c2:#3aa0ff; --c3:#b56cff; --c4:#ff8a3d; --c5:#ff4fb3; --c6:#5dff8f; --c7:#ffd23d;
  --display:"Orbitron","Exo 2",system-ui,sans-serif; --body:"Exo 2",system-ui,sans-serif;
  color-scheme:dark;
}
body{
  background:
    radial-gradient(900px 500px at 10% -10%,#3aa0ff33,transparent 60%),
    radial-gradient(800px 500px at 100% 0%,#b56cff33,transparent 60%),
    radial-gradient(700px 600px at 50% 110%,#00f0d022,transparent 60%),
    linear-gradient(#ffffff08 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
  background-attachment:fixed;
}
.hero{position:relative;background:#0b1020d9;color:var(--fg);border:1px solid #3aa0ff66;
  box-shadow:0 0 0 1px #00f0d022 inset,0 0 40px #3aa0ff33,0 0 80px #b56cff22;backdrop-filter:blur(6px);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c5),var(--c4))}
.hero h1{font-size:clamp(22px,4.6vw,34px);letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--c1),var(--c2) 45%,var(--c3) 75%,var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted)}
.big b{color:var(--c1);text-shadow:0 0 18px #00f0d099;font-size:48px}
.bar{background:#ffffff12;border:1px solid #ffffff1f;height:14px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c5));box-shadow:0 0 16px #3aa0ffaa;position:relative;overflow:hidden}
.bar i::after,.lbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff88,transparent);transform:translateX(-100%);animation:scan 2.6s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}
.chip{background:#ffffff0d;border:1px solid #3aa0ff55;color:var(--fg);font-family:var(--body);letter-spacing:.03em}
.legend{font-family:var(--body)}
.level{background:var(--card);border:1px solid color-mix(in srgb,var(--col) 45%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--col) 22%,transparent);backdrop-filter:blur(6px)}
.lh{background:linear-gradient(90deg,color-mix(in srgb,var(--col) 22%,transparent),transparent);border-bottom:1px solid color-mix(in srgb,var(--col) 60%,transparent)}
.lh h2{font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 12px color-mix(in srgb,var(--col) 70%,transparent)}
.lh .pct{text-shadow:0 0 10px color-mix(in srgb,var(--col) 70%,transparent)}
.lbar{background:#ffffff10}
.lbar i{position:relative;overflow:hidden;box-shadow:0 0 12px var(--col)}
.gt{color:var(--col);opacity:.85;font-family:var(--display);font-size:11px;letter-spacing:.14em}
label.item{border-top-color:#ffffff10}
label.item:hover{background:color-mix(in srgb,var(--col) 7%,transparent)}
input[type=checkbox]{background:transparent;border-radius:5px;box-shadow:0 0 8px color-mix(in srgb,var(--col) 50%,transparent)}
input[type=checkbox]:checked{box-shadow:0 0 14px var(--col)}
input[type=checkbox]:checked::after{border-color:#05070f}
.tag{background:color-mix(in srgb,var(--col) 14%,transparent);border:1px solid color-mix(in srgb,var(--col) 50%,transparent)}
.tag.cert{background:var(--col);color:#05070f;box-shadow:0 0 12px color-mix(in srgb,var(--col) 60%,transparent)}
.det a{color:var(--col)}
.iw{border-top:1px solid #ffffff10}
.group .iw:first-of-type{border-top:0}
label.item{border-top:0!important}
.chaps{margin:0 0 12px 36px;font-size:13.5px}
.chaps summary{cursor:pointer;color:var(--col);font-weight:600;letter-spacing:.03em;padding:2px 0;list-style:none}
.chaps summary::-webkit-details-marker{display:none}
.chaps summary::before{content:"▸ "}
.chaps[open] summary::before{content:"▾ "}
.chaps.alldone summary{opacity:.6}
.chaps ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ch-h{margin-top:10px;font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chap-l{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;cursor:pointer;padding:4px 0}
.chap-l input{width:16px;height:16px;border-radius:4px;border-width:2px}
.chap-l input:checked::after{width:4px;height:8px;border-width:0 2px 2px 0}
.chap-l input:checked + span{text-decoration:line-through;opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const KEY="parcours-rio-tinto-v1";
let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const root=document.getElementById("levels");
DATA.forEach(lv=>{
  const sec=document.createElement("section");sec.className="level";
  sec.style.setProperty("--col",`var(--c${lv.col})`);sec.style.setProperty("--tint",`var(--t${lv.col})`);
  let html=`<div class="lh"><div class="row"><h2>${lv.title}</h2><span class="pct" data-pct></span></div><span class="meta">${lv.meta}</span><div class="lbar"><i data-bar></i></div></div>`;
  lv.groups.forEach((g,gi)=>{html+=`<div class="group"><div class="gt">${g.t}</div>`;
    g.items.forEach((it,ii)=>{const id=`${lv.id}-${gi}-${ii}`;if(state[id]===undefined&&it[3])state[id]=true;
      html+=`<div class="iw"><label class="item" for="${id}"><input type="checkbox" class="main" id="${id}"><span class="name">${it[0]}<span class="det">${it[1]}</span></span><span class="tag${it[2].startsWith("🎓")?" cert":""}">${it[2]}</span></label>`;
      if(it[4]){let k=0;html+=`<details class="chaps" data-parent="${id}"><summary>Chapitres <span data-cc></span></summary><ul>`;
        it[4].forEach(c=>{if(c.startsWith("§")){html+=`<li class="ch-h">${c.slice(1)}</li>`}else{const cid=`${id}-c${k++}`;html+=`<li><label class="chap-l" for="${cid}"><input type="checkbox" class="chap" id="${cid}"><span>${c}</span></label></li>`}});
        html+=`</ul></details>`}
      html+=`</div>`});
    html+=`</div>`});
  sec.innerHTML=html;root.appendChild(sec);
});
function refresh(){
  let all=0,done=0,certs=0,certsDone=0,next=null;
  document.querySelectorAll("details.chaps").forEach(d=>{const cs=[...d.querySelectorAll("input.chap")];const n=cs.filter(c=>c.checked).length;d.querySelector("[data-cc]").textContent=`${n}/${cs.length}`;d.classList.toggle("alldone",n===cs.length)});
  root.querySelectorAll(".level").forEach((sec,i)=>{
    const boxes=[...sec.querySelectorAll("input.main")];const d=boxes.filter(b=>b.checked).length;
    all+=boxes.length;done+=d;const p=Math.round(d/boxes.length*100);
    sec.querySelector("[data-pct]").textContent=`${d}/${boxes.length} · ${p} %`;
    sec.querySelector("[data-bar]").style.width=p+"%";
    boxes.forEach(b=>{const lab=b.closest("label");lab.classList.toggle("done",b.checked);
      if(lab.querySelector(".tag.cert")){certs++;if(b.checked)certsDone++}
      if(!b.checked&&!next&&i<4)next=lab.querySelector(".name").firstChild.textContent});
  });
  const p=Math.round(done/all*100);
  document.getElementById("gPct").textContent=p+" %";
  document.getElementById("gTxt").textContent=`${done} étapes terminées sur ${all}`;
  document.getElementById("gBar").style.width=p+"%";
  document.getElementById("next").textContent=next||"tout est fait 🎉";
  document.getElementById("certCount").textContent=`🎓 ${certsDone}/${certs} certifications`;
}
root.querySelectorAll("input").forEach(b=>{b.checked=!!state[b.id];b.addEventListener("change",()=>{state[b.id]=b.checked;
  const d=b.closest("details.chaps");
  if(d){const cs=[...d.querySelectorAll("input.chap")];if(cs.every(c=>c.checked)){const p=document.getElementById(d.dataset.parent);p.checked=true;state[p.id]=true}}
  save();refresh()})});
refresh();
</script>
