<title>Parcours Rio Tinto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;500;600;700&display=swap">
<style>
/* Layout : en-tête avec progression globale, puis une carte colorée par niveau, chaque étape cochable */
:root{
  --bg:#f5f7fb; --card:#ffffff; --fg:#14182b; --muted:#5b6380; --line:#e2e6f0;
  --c1:#0ea5a4; --c2:#2563eb; --c3:#7c3aed; --c4:#ea580c; --c5:#db2777; --c6:#16a34a;
  --t1:#e6f7f7; --t2:#e8effd; --t3:#f1ebfe; --t4:#fdefe6; --t5:#fce8f2; --t6:#e7f6ec;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --card:#181c2e; --fg:#eef0fa; --muted:#9aa2c2; --line:#2a3048;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa; --c4:#fb923c; --c5:#f472b6; --c6:#4ade80;
  --t1:#123033; --t2:#16233f; --t3:#221b3d; --t4:#33221a; --t5:#331a2a; --t6:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --card:#181c2e; --fg:#eef0fa; --muted:#9aa2c2; --line:#2a3048;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa; --c4:#fb923c; --c5:#f472b6; --c6:#4ade80;
  --t1:#123033; --t2:#16233f; --t3:#221b3d; --t4:#33221a; --t5:#331a2a; --t6:#16301f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0}
.hero{background:linear-gradient(120deg,var(--c1),var(--c2) 40%,var(--c3) 70%,var(--c4));color:#fff;border-radius:18px;padding:22px}
.hero .sub{color:#ffffffd9}
.big{display:flex;align-items:baseline;gap:10px;margin-top:16px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:#ffffff40;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#ffffff26;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.level{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lh{background:var(--tint);padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--col)}
.lh .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.lh h2{font-size:20px;color:var(--col)}
.lh .pct{font-family:var(--display);font-weight:700;color:var(--col);font-variant-numeric:tabular-nums}
.lh .meta{color:var(--muted);font-size:13px}
.lbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--col);transition:width .4s}
.group{padding:4px 18px 10px}
.gt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 4px}
label.item{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.group label.item:first-of-type{border-top:0}
input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid var(--col);border-radius:7px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--card)}
input[type=checkbox]:checked{background:var(--col)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
input:focus-visible{outline:3px solid var(--col);outline-offset:2px}
.name{font-weight:600;min-width:0}
.det{display:block;font-weight:400;color:var(--muted);font-size:13px}
.det a{color:var(--col)}
.done .name{text-decoration:line-through;opacity:.55}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--tint);color:var(--col)}
.tag.cert{background:var(--col);color:var(--card)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
/* ===== Thème futuriste : un seul look sombre néon, choisi volontairement ===== */
:root:root:root{
  --bg:#05070f; --card:#0b1020cc; --fg:#e8f1ff; --muted:#8fa3c7; --line:#1d2a48;
  --c1:#00f0d0; --c2:#3aa0ff; --c3:#b56cff; --c4:#ff8a3d; --c5:#ff4fb3; --c6:#5dff8f;
  --display:"Orbitron","Exo 2",system-ui,sans-serif; --body:"Exo 2",system-ui,sans-serif;
  color-scheme:dark;
}
body{
  background:
    radial-gradient(900px 500px at 10% -10%,#3aa0ff33,transparent 60%),
    radial-gradient(800px 500px at 100% 0%,#b56cff33,transparent 60%),
    radial-gradient(700px 600px at 50% 110%,#00f0d022,transparent 60%),
    linear-gradient(#ffffff08 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
  background-attachment:fixed;
}
.hero{position:relative;background:#0b1020d9;color:var(--fg);border:1px solid #3aa0ff66;
  box-shadow:0 0 0 1px #00f0d022 inset,0 0 40px #3aa0ff33,0 0 80px #b56cff22;backdrop-filter:blur(6px);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c5),var(--c4))}
.hero h1{font-size:clamp(22px,4.6vw,34px);letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--c1),var(--c2) 45%,var(--c3) 75%,var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted)}
.big b{color:var(--c1);text-shadow:0 0 18px #00f0d099;font-size:48px}
.bar{background:#ffffff12;border:1px solid #ffffff1f;height:14px}
.bar i{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c5));box-shadow:0 0 16px #3aa0ffaa;position:relative;overflow:hidden}
.bar i::after,.lbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff88,transparent);transform:translateX(-100%);animation:scan 2.6s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}
.chip{background:#ffffff0d;border:1px solid #3aa0ff55;color:var(--fg);font-family:var(--body);letter-spacing:.03em}
.legend{font-family:var(--body)}
.level{background:var(--card);border:1px solid color-mix(in srgb,var(--col) 45%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--col) 22%,transparent);backdrop-filter:blur(6px)}
.lh{background:linear-gradient(90deg,color-mix(in srgb,var(--col) 22%,transparent),transparent);border-bottom:1px solid color-mix(in srgb,var(--col) 60%,transparent)}
.lh h2{font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 12px color-mix(in srgb,var(--col) 70%,transparent)}
.lh .pct{text-shadow:0 0 10px color-mix(in srgb,var(--col) 70%,transparent)}
.lbar{background:#ffffff10}
.lbar i{position:relative;overflow:hidden;box-shadow:0 0 12px var(--col)}
.gt{color:var(--col);opacity:.85;font-family:var(--display);font-size:11px;letter-spacing:.14em}
label.item{border-top-color:#ffffff10}
label.item:hover{background:color-mix(in srgb,var(--col) 7%,transparent)}
input[type=checkbox]{background:transparent;border-radius:5px;box-shadow:0 0 8px color-mix(in srgb,var(--col) 50%,transparent)}
input[type=checkbox]:checked{box-shadow:0 0 14px var(--col)}
input[type=checkbox]:checked::after{border-color:#05070f}
.tag{background:color-mix(in srgb,var(--col) 14%,transparent);border:1px solid color-mix(in srgb,var(--col) 50%,transparent)}
.tag.cert{background:var(--col);color:#05070f;box-shadow:0 0 12px color-mix(in srgb,var(--col) 60%,transparent)}
.det a{color:var(--col)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="hero">
    <h1>Mon parcours vers Rio Tinto</h1>
    <p class="sub">Technicien → administrateur → ingénieur → architecte cloud, réseau et IA. Coche chaque étape terminée.</p>
    <div class="big"><b id="gPct">0 %</b><span id="gTxt"></span></div>
    <div class="bar"><i id="gBar" style="width:0"></i></div>
    <div class="chips"><span class="chip">Prochaine étape : <span id="next"></span></span><span class="chip" id="certCount"></span></div>
  </header>
  <div class="legend"><span>🏅 Badge = cours gratuit</span><span>🎓 Certification = examen payant (≈ CAD)</span><span>Tes coches restent enregistrées dans ce navigateur.</span></div>
  <main id="levels" class="wrap"></main>
</div>

<script>
const L=(t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const DATA=[
 {id:"n1",title:"Niveau 1 — Technicien",col:1,meta:"Les fondations · ~140 $",groups:[
  {t:"Au travail (pauses et dîner) — cours IA",items:[
   ["Claude 101 + Maîtrise de l'IA (AI Fluency)",L("academy.claude.com","https://academy.claude.com"),"🏅 2 badges"],
   ["Explorer Microsoft 365 Copilot Chat",L("Microsoft Learn","https://learn.microsoft.com/training/paths/explore-microsoft-365-copilot-business-chat/"),"🏅 Trophées"],

   ["Fondements de l'IA (AI Foundations)",L("academy.openai.com","https://academy.openai.com"),"🏅 Certificat"],
   ["Fondements de l'IA appliquée (Applied AI Foundations)","OpenAI Academy","🏅 Certificat"],
   ["Agents et flux de travail (Agents and Workflows)","OpenAI Academy","🏅 Certificat"],
   ["Rédiger, analyser et présenter avec Microsoft 365 Copilot",L("Microsoft Learn","https://learn.microsoft.com/training/paths/draft-analyze-present-microsoft-365-copilot/"),"🏅 Trophées"],
   ["Google : IA générative · grands modèles de langage · IA responsable",L("cloudskillsboost.google","https://www.cloudskillsboost.google"),"🏅 3 badges"],
   ["Fondamentaux de l'IA (IBM)",L("skillsbuild.org","https://skillsbuild.org"),"🏅 Badge"],
   ["Elements of AI : Introduction à l'IA",L("elementsofai.com","https://www.elementsofai.com"),"🏅 Certificat"]]},
  {t:"À la maison (16 h 30 – 18 h 30) — cloud, réseau, code",items:[
   ["Notions fondamentales d'Azure (parcours AZ-900)",L("Guide d'étude","https://learn.microsoft.com/credentials/certifications/resources/study-guides/az-900"),"🏅 Trophées"],
   ["AWS Cloud Practitioner",L("skillbuilder.aws","https://skillbuilder.aws"),"🎓 ~140 $"],
   ["PowerShell 101",L("Microsoft Learn","https://learn.microsoft.com/powershell/scripting/learn/ps101/00-introduction"),"🏅 Trophées"],
   ["Python",L("Kaggle","https://www.kaggle.com/learn/python"),"🏅 Certificat"],
   ["Cisco : Bases des réseaux","Déjà fait","🏅 Badge",true],
   ["Cisco : Équipements réseau et configuration initiale",L("skillsforall.com","https://www.skillsforall.com"),"🏅 Badge"],
   ["Cisco : Adressage réseau et dépannage de base","skillsforall.com","🏅 Badge"],
   ["Cisco : Support et sécurité des réseaux","skillsforall.com","🏅 Badge"],
   ["Elements of AI : Construire l'IA (après Python)","elementsofai.com","🏅 Certificat"],
   ["Veeam Agent pour Windows : sauvegarder puis restaurer un dossier de ton PC (fin de semaine)",L("veeam.com","https://www.veeam.com"),"Gratuit"],
   ["Veeam University : Veeam Data Platform",L("Veeam University","https://www.veeam.com/university.html"),"🏅 Certificat"]]}]},
 {id:"n2",title:"Niveau 2 — Administrateur",col:2,meta:"Ouvre la candidature chez Rio Tinto · ~3 000 à 3 800 $",groups:[{t:"Dans l'ordre",items:[
   ["⭐ AZ-104 — Administrateur Azure (examen visé en janvier)",L("6 parcours + labs","https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/"),"🎓 ~220 $"],
   ["Linux : Initiation + Les essentiels de Linux",L("netacad.com","https://www.netacad.com"),"🏅 Badges"],
   ["AWS SysOps Administrator – Associate","skillbuilder.aws","🎓 ~210 $"],
   ["AZ-802 — Windows Server",L("Guide d'étude","https://learn.microsoft.com/credentials/certifications/resources/study-guides/az-802"),"🎓 ~220 $"],
   ["Bases de SAP",L("learning.sap.com","https://learning.sap.com"),"🏅 Badges"],
   ["CCNA (en anglais)","netacad.com — 3 cours","🎓 ~420 $"],
   ["ITIL 4 Foundation",L("peoplecert.org","https://www.peoplecert.org"),"🎓 ~450–1 000 $"],
   ["CompTIA Security+",L("Professor Messer","https://www.professormesser.com"),"🎓 ~595 $"],
   ["AI-901 — L'IA dans Azure",L("Concepts de l'IA","https://learn.microsoft.com/training/paths/ai-concepts/"),"🎓 ~125 $"],
   ["AWS AI Practitioner","skillbuilder.aws","🎓 ~140 $"],
   ["GitHub Foundations (GH-900) + GitHub Copilot (GH-300)",L("skills.github.com","https://skills.github.com"),"🎓 ~140 $ ×2"],
   ["OCI AI Foundations (Oracle)",L("mylearn.oracle.com","https://mylearn.oracle.com"),"🎓 souvent gratuit"],
   ["Claude : Code · MCP · Compétences d'agents · Sous-agents + Claude Certified Associate","academy.claude.com","🎓 ~140 $"],
   ["Copilot : bases des agents IA + Copilot Studio",L("Créer des agents","https://learn.microsoft.com/training/paths/create-extend-custom-copilots-microsoft-copilot-studio/"),"🏅 Trophées"],
   ["TOEIC (anglais)",L("ets.org","https://www.ets.org/toeic.html"),"🎓 ~150–350 $"],
   ["Mandarin débutant + HSK 1","Duolingo · HelloChinese","🎓 ~50 $"],
   ["Power Automate pour le bureau (gratuit dans Windows 11) : automatiser une tâche sur ton PC","Microsoft Learn","🏅 Trophées"],
   ["Parcours Power Automate (avec Copilot Studio)",L("Microsoft Learn","https://learn.microsoft.com/training/browse/?products=power-automate"),"🏅 Trophées"],
   ["Optionnel : PL-900 Power Platform (vérifier qu'elle est toujours offerte)","Microsoft Learn","🎓 ~125 $"]]}]},
 {id:"n3",title:"Niveau 3 — Ingénieur",col:3,meta:"Construire et automatiser · ~1 300 à 2 300 $",groups:[{t:"Dans l'ordre",items:[
   ["AWS Solutions Architect – Associate","skillbuilder.aws","🎓 ~210 $"],
   ["Terraform Associate",L("developer.hashicorp.com","https://developer.hashicorp.com/certifications"),"🎓 ~100 $"],
   ["Labo Proxmox + Veeam Backup & Replication Community Edition (sauvegarder les machines virtuelles)",L("veeam.com","https://www.veeam.com"),"Gratuit"],
   ["Sécurité industrielle : CISA puis ISA/IEC 62443",L("cisa.gov","https://www.cisa.gov"),"🎓 variable"],
   ["AB-650 — Microsoft 365 et IA","Microsoft Learn","🎓 ~220 $"],
   ["AWS Machine Learning Engineer – Associate","skillbuilder.aws","🎓 ~210 $"],
   ["AI-300 — MLOps","Microsoft Learn","🎓 ~220 $"],
   ["NVIDIA NCA-AIIO + NCA-GENL",L("NVIDIA DLI","https://www.nvidia.com/en-us/training/"),"🎓 à vérifier"],
   ["Claude : API + MCP avancé + Claude Certified Developer","academy.claude.com","🎓 ~175 $"],
   ["Google AI Essentials + Generative AI Leader","Coursera · Google Cloud","🎓 ~140 $"],
   ["HCIA-AI (Huawei)","Huawei Talent","🎓 à vérifier"],
   ["SQL : Introduction + avancé","Kaggle","🏅 Certificats"],
   ["Mandarin : HSK 2","Centre HSK","🎓 ~80 $"]]}]},
 {id:"n4",title:"Niveau 4 — Architecte",col:4,meta:"Concevoir le cloud et l'IA · ~1 400 à 1 700 $ + TOGAF",groups:[{t:"Dans l'ordre",items:[
   ["⭐ AWS Solutions Architect – Professional","skillbuilder.aws","🎓 ~420 $"],
   ["AZ-305 — Architecte de solutions Azure","Microsoft Learn","🎓 ~220 $"],
   ["TOGAF — architecture d'entreprise",L("opengroup.org","https://www.opengroup.org"),"🎓 variable"],
   ["Claude Certified Architect – Foundations puis Professional","academy.claude.com","🎓 ~175 + 245 $"],
   ["Optionnel : FinOps · SC-100 · AWS IA générative Pro","Sites officiels","🎓 à vérifier"],
   ["Mandarin : HSK 3","Centre HSK","🎓 ~120 $"]]}]},
 {id:"n5",title:"Langues et développement personnel",col:5,meta:"Tous les jours, à chaque niveau",groups:[{t:"Habitudes",items:[
   ["Anglais 30 min par jour",L("BBC Learning English","https://www.bbc.co.uk/learningenglish"),"Quotidien"],
   ["Mandarin 15 min par jour","Duolingo · HelloChinese","Quotidien"],
   ["Règle des 24 heures avant toute grosse décision","« Est-ce que ça me rapproche de Rio Tinto ? »","Leadership"],
   ["Technique STOP quand la colère monte","Stop · respirer · observer · poursuivre","Émotions"],
   ["Méditation 5 minutes","Le soir, avant la lecture","Calme"],
   ["Lire : Un rien peut tout changer","James Clear","Livre 1"],
   ["Lire : L'intelligence émotionnelle","Daniel Goleman","Livre 2"],
   ["Lire : Système 1 / Système 2","Daniel Kahneman","Livre 3"],
   ["Lire : Les 7 habitudes des gens efficaces","Stephen Covey","Livre 4"],
   ["Lire : Les leaders mangent en dernier","Simon Sinek","Livre 5"]]}]},
 {id:"n6",title:"Projets et visibilité",col:6,meta:"Ce qui fait la différence en entrevue",groups:[{t:"Portfolio GitHub",items:[
   ["Scripts PowerShell (premier : Get-InfosPC)","GitHub","Projet"],
   ["Assistant IA hors ligne pour un site minier (Ollama + Mistral)","GitHub","Projet"],
   ["Agent Copilot Studio pour les procédures de sécurité","GitHub","Projet"],
   ["Labo Windows Server + Active Directory + sauvegardes","GitHub","Projet"],
   ["Démo de maintenance prédictive (Python, AWS)","GitHub","Projet"],
   ["Détection d'équipements de sécurité (vision)","GitHub","Projet"]]},
  {t:"Visibilité",items:[
   ["LinkedIn : badges + 1 post par semaine","Réseau Rio Tinto","Visibilité"],
   ["Profil et alertes sur jobs.riotinto.com",L("jobs.riotinto.com","https://jobs.riotinto.com"),"Visibilité"],
   ["Vidéos THIERNO IT","TikTok · Facebook","Visibilité"]]}]}
];
const KEY="parcours-rio-tinto-v1";
let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const root=document.getElementById("levels");
DATA.forEach(lv=>{
  const sec=document.createElement("section");sec.className="level";
  sec.style.setProperty("--col",`var(--c${lv.col})`);sec.style.setProperty("--tint",`var(--t${lv.col})`);
  let html=`<div class="lh"><div class="row"><h2>${lv.title}</h2><span class="pct" data-pct></span></div><span class="meta">${lv.meta}</span><div class="lbar"><i data-bar></i></div></div>`;
  lv.groups.forEach((g,gi)=>{html+=`<div class="group"><div class="gt">${g.t}</div>`;
    g.items.forEach((it,ii)=>{const id=`${lv.id}-${gi}-${ii}`;if(state[id]===undefined&&it[3])state[id]=true;
      html+=`<label class="item" for="${id}"><input type="checkbox" id="${id}"><span class="name">${it[0]}<span class="det">${it[1]}</span></span><span class="tag${it[2].startsWith("🎓")?" cert":""}">${it[2]}</span></label>`});
    html+=`</div>`});
  sec.innerHTML=html;root.appendChild(sec);
});
function refresh(){
  let all=0,done=0,certs=0,certsDone=0,next=null;
  root.querySelectorAll(".level").forEach((sec,i)=>{
    const boxes=[...sec.querySelectorAll("input")];const d=boxes.filter(b=>b.checked).length;
    all+=boxes.length;done+=d;const p=Math.round(d/boxes.length*100);
    sec.querySelector("[data-pct]").textContent=`${d}/${boxes.length} · ${p} %`;
    sec.querySelector("[data-bar]").style.width=p+"%";
    boxes.forEach(b=>{const lab=b.closest("label");lab.classList.toggle("done",b.checked);
      if(lab.querySelector(".tag.cert")){certs++;if(b.checked)certsDone++}
      if(!b.checked&&!next&&i<4)next=lab.querySelector(".name").firstChild.textContent});
  });
  const p=Math.round(done/all*100);
  document.getElementById("gPct").textContent=p+" %";
  document.getElementById("gTxt").textContent=`${done} étapes terminées sur ${all}`;
  document.getElementById("gBar").style.width=p+"%";
  document.getElementById("next").textContent=next||"tout est fait 🎉";
  document.getElementById("certCount").textContent=`🎓 ${certsDone}/${certs} certifications`;
}
root.querySelectorAll("input").forEach(b=>{b.checked=!!state[b.id];b.addEventListener("change",()=>{state[b.id]=b.checked;save();refresh()})});
refresh();
</script>
